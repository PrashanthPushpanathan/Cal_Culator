name: Build & Attach Assets on Release Publish

on:
  release:
    types: [published]

permissions:
  contents: write

env:
  NODE_OPTIONS: --openssl-legacy-provider
  APP_NAME: Cal-Culator

jobs:
  build-and-attach:
    runs-on: ubuntu-latest

    steps:
      - name: 🧾 Checkout tag for this release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: 🏗 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 🧰 Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 🧰 Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          target: default
          arch: x86_64
          build-tools: 34.0.0

      - name: Set API Key in app.json
        run: |
          jq '.expo.extra.GptToken = "${{ secrets.GPT_TOKEN }}"' app.json > temp.json && mv temp.json app.json

      - name: 📦 Install JS dependencies
        run: npm ci

      - name: 🧱 Prebuild Android project (Expo)
        run: npx expo prebuild --platform android --non-interactive --clean

      - name: 📦 Build Dev APK (pre-release)
        if: github.event.release.prerelease == true
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          mkdir -p dist
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleDebug
          cd ..
          mv android/app/build/outputs/apk/debug/app-debug.apk \
             dist/${APP_NAME}_dev_${VERSION}.apk

      - name: 📦 Build Prod APK + AAB (normal release)
        if: github.event.release.prerelease == false
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          mkdir -p dist
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease
          cd ..
          mv android/app/build/outputs/apk/release/app-release.apk \
             dist/${APP_NAME}_${VERSION}.apk
          mv android/app/build/outputs/bundle/release/app-release.aab \
             dist/${APP_NAME}_${VERSION}.aab

      - name: 🚀 Attach assets to the published GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: dist/*
